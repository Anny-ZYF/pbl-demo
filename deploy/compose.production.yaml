name: pbl

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: groupwork
      MYSQL_USER: groupwork_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?required}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--innodb-buffer-pool-size=128M", "--max-connections=60", "--performance-schema=OFF", "--binlog-expire-logs-seconds=259200"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ../backend/database/groupwork_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../backend/database/groupwork_seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *bounded-logging

  algorithm:
    image: pbl-algorithm:${PBL_RELEASE:?required}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.runtime
      target: algorithm
      args:
        DEBIAN_MIRROR: ${PBL_DEBIAN_MIRROR:-https://deb.debian.org}
        PIP_INDEX_URL: ${PBL_PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.0
    environment:
      ALGORITHM_SERVICE_TOKEN: ${MODEL_SERVICE_TOKEN:?required}
      TZ: Asia/Shanghai
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)); assert h['status']=='ok' and h['modelAvailable'], h"]
      interval: 10s
      timeout: 5s
      retries: 18
    logging: *bounded-logging

  backend:
    image: pbl-backend:${PBL_RELEASE:?required}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.runtime
      target: backend
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.5
    depends_on:
      mysql:
        condition: service_healthy
      algorithm:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DB_URL: jdbc:mysql://mysql:3306/groupwork?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: groupwork_app
      DB_PASSWORD: ${MYSQL_APP_PASSWORD}
      DB_POOL_SIZE: "6"
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?required}
      MODEL_SERVICE_URL: http://algorithm:8000
      MODEL_SERVICE_TOKEN: ${MODEL_SERVICE_TOKEN}
      CORS_ALLOWED_ORIGINS: https://pbl.luzujian.com
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-PBL管理员}
      STORAGE_ROOT: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 18
    logging: *bounded-logging

  frontend:
    image: pbl-frontend:${PBL_RELEASE:?required}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.runtime
      target: frontend
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:15880:80"
    networks:
      default: {}
      pbl-edge:
        aliases: [pbl-web]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *bounded-logging

volumes:
  mysql-data:
  uploads:

networks:
  pbl-edge:
    external: true
    name: pbl-edge
