# Only the trusted HTTPS ingress and the host loopback port reach this service.
map $http_x_forwarded_proto $pbl_forwarded_proto {
    default $scheme;
    https https;
    http http;
}

map $http_x_forwarded_for $pbl_client_ip {
    default $http_x_forwarded_for;
    "" $remote_addr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $pbl_client_ip;
        proxy_set_header X-Forwarded-For $pbl_client_ip;
        proxy_set_header X-Forwarded-Proto $pbl_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
